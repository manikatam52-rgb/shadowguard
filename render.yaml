databases:
  - name: shadowguard-db
    databaseName: shadowguard
    user: shadowguard
    plan: free
    region: singapore
    postgresMajorVersion: 18

services:
  - type: web
    name: shadowguard-backend
    runtime: node
    rootDir: backend
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DRIVER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: shadowguard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
